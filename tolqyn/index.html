<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Толқын — музыка независимых артистов</title>
<meta name="description" content="Музыкальный стриминг для независимых артистов из Казахстана. Слушайте, создавайте плейлисты и выкладывайте свои треки.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Rubik:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  /* Тёмная тема (по умолчанию) */
  :root {
    --bg: #0d0e12;
    --panel: #15171d;
    --card: #1b1e26;
    --hover: #252933;
    --text: #f1f2f5;
    --muted: #9aa0ad;
    --line: #2a2e38;
    --accent: #5ee3c1;
    --accent-2: #8b7cff;
    --on-accent: #08201a;
    --shadow: 0 16px 40px rgba(0,0,0,.45);
    --r: 14px;
  }
  /* Светлая тема */
  :root[data-theme="light"] {
    --bg: #eef0f4;
    --panel: #ffffff;
    --card: #ffffff;
    --hover: #eceef3;
    --text: #15171c;
    --muted: #646b78;
    --line: #e0e3ea;
    --accent: #0f9e7e;
    --accent-2: #6c5ce7;
    --on-accent: #ffffff;
    --shadow: 0 16px 40px rgba(30,40,60,.14);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body { font-family: "Inter", system-ui, sans-serif; background: var(--bg); color: var(--text); font-size: 15px; line-height: 1.5; overflow: hidden; }
  h1, h2, h3, .logo { font-family: "Rubik", sans-serif; line-height: 1.15; }
  a { color: inherit; text-decoration: none; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  img { display: block; max-width: 100%; }
  input, select, textarea { font: inherit; color: var(--text); background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 11px 14px; width: 100%; }
  input:focus, select:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  textarea { resize: vertical; min-height: 80px; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .muted { color: var(--muted); }
  .small { font-size: 13px; }

  /* Каркас: боковая панель + контент + плеер */
  .app { display: grid; grid-template-columns: 250px 1fr; gap: 8px; height: calc(100vh - 96px); padding: 8px 8px 0; }
  .side { background: var(--panel); border-radius: var(--r); padding: 18px 12px; display: flex; flex-direction: column; gap: 4px; overflow-y: auto; }
  .logo { font-size: 24px; font-weight: 800; display: flex; align-items: center; gap: 10px; padding: 0 10px 16px; }
  .logo svg { width: 34px; height: 34px; }
  .nav-link { display: flex; align-items: center; gap: 14px; padding: 10px 12px; border-radius: 10px; color: var(--muted); font-weight: 600; transition: color .15s, background .15s; }
  .nav-link:hover { color: var(--text); background: var(--hover); }
  .nav-link.on { color: var(--text); background: var(--hover); }
  .nav-link .ic { width: 22px; text-align: center; font-size: 17px; }
  .side h4 { font-size: 12px; text-transform: uppercase; letter-spacing: .12em; color: var(--muted); padding: 18px 12px 8px; display: flex; justify-content: space-between; align-items: center; }
  .side h4 button { font-size: 20px; color: var(--muted); line-height: 1; }
  .side h4 button:hover { color: var(--text); }
  .lib-item { display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: 10px; }
  .lib-item:hover, .lib-item.on { background: var(--hover); }
  .lib-item .mini { width: 40px; height: 40px; border-radius: 8px; flex: none; overflow: hidden; }
  .lib-item b { display: block; font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .lib-item span { font-size: 12px; color: var(--muted); }
  .side-foot { margin-top: auto; padding: 14px 6px 0; display: flex; gap: 8px; }

  .main { background: var(--panel); border-radius: var(--r); overflow-y: auto; position: relative; }
  .page { padding: 0 28px 40px; }
  .top-glow { position: absolute; inset: 0 0 auto 0; height: 340px; pointer-events: none; opacity: .55; transition: background .6s; }
  .topbar { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 12px; padding: 14px 28px; }
  .topbar.scrolled { background: color-mix(in srgb, var(--panel) 88%, transparent); backdrop-filter: blur(12px); }
  .round { width: 38px; height: 38px; border-radius: 50%; background: color-mix(in srgb, var(--bg) 70%, transparent); display: grid; place-items: center; font-size: 16px; flex: none; }
  .round:hover { background: var(--hover); }
  .topbar .grow { flex: 1; }
  .pill { padding: 9px 16px; border-radius: 99px; font-weight: 600; font-size: 14px; background: var(--text); color: var(--bg); }
  .pill.ghost { background: transparent; color: var(--text); border: 1px solid var(--line); }
  .pill.accent { background: var(--accent); color: var(--on-accent); }
  .pill:hover { transform: scale(1.03); }
  .rel { position: relative; }

  /* Секции главной */
  .greet { font-size: 32px; font-weight: 800; margin: 6px 0 20px; }
  .quick { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 10px; margin-bottom: 30px; }
  .quick a { display: flex; align-items: center; gap: 12px; background: color-mix(in srgb, var(--text) 7%, transparent); border-radius: 8px; overflow: hidden; font-weight: 700; font-size: 14px; padding-right: 10px; transition: background .2s; }
  .quick a:hover { background: color-mix(in srgb, var(--text) 13%, transparent); }
  .quick .mini { width: 56px; height: 56px; flex: none; }
  .section { margin-bottom: 34px; }
  .section-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 14px; gap: 10px; }
  .section-head h2 { font-size: 22px; }
  .section-head a { color: var(--muted); font-size: 13px; font-weight: 600; }
  .section-head a:hover { color: var(--text); text-decoration: underline; }
  .shelf { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 16px; }
  .tile { padding: 12px; border-radius: 12px; transition: background .2s; position: relative; cursor: pointer; }
  .tile:hover { background: var(--hover); }
  .tile .art { aspect-ratio: 1; border-radius: 10px; overflow: hidden; box-shadow: 0 8px 24px rgba(0,0,0,.35); margin-bottom: 12px; position: relative; }
  .tile .art img { width: 100%; height: 100%; object-fit: cover; }
  .tile.round-art .art { border-radius: 50%; }
  .tile b { display: block; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tile span { font-size: 13px; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .fab { position: absolute; right: 8px; bottom: 8px; width: 48px; height: 48px; border-radius: 50%; background: var(--accent); color: var(--on-accent); font-size: 18px; display: grid; place-items: center; box-shadow: 0 8px 20px rgba(0,0,0,.4); opacity: 0; transform: translateY(8px); transition: opacity .2s, transform .2s; }
  .tile:hover .fab, .tile .fab.on { opacity: 1; transform: none; }
  .collage { display: grid; grid-template-columns: 1fr 1fr; width: 100%; height: 100%; }
  .collage img { width: 100%; height: 100%; object-fit: cover; }

  /* Моя волна */
  .wave-card { position: relative; overflow: hidden; border-radius: 18px; padding: 30px; margin-bottom: 34px; background: linear-gradient(120deg, color-mix(in srgb, var(--accent-2) 70%, #000), color-mix(in srgb, var(--accent) 55%, #000)); color: #fff; }
  .wave-card h2 { font-size: 30px; font-weight: 800; margin-bottom: 6px; }
  .wave-card p { opacity: .85; max-width: 440px; margin-bottom: 18px; }
  .moods { display: flex; gap: 8px; flex-wrap: wrap; position: relative; z-index: 1; }
  .mood { padding: 10px 16px; border-radius: 99px; background: rgba(255,255,255,.14); border: 1px solid rgba(255,255,255,.25); color: #fff; font-weight: 600; backdrop-filter: blur(6px); transition: background .2s, transform .1s; }
  .mood:hover { background: rgba(255,255,255,.26); }
  .mood:active { transform: scale(.96); }
  .mood.on { background: #fff; color: #1a1a2a; }
  .waves { position: absolute; right: -40px; bottom: -30px; width: 460px; height: 200px; opacity: .55; }
  .waves path { animation: wave 6s ease-in-out infinite alternate; transform-origin: center; }
  .waves path:nth-child(2) { animation-duration: 8s; animation-delay: -2s; }
  .waves path:nth-child(3) { animation-duration: 10s; animation-delay: -4s; }
  @keyframes wave { from { transform: translateX(-30px) scaleY(.9); } to { transform: translateX(30px) scaleY(1.1); } }

  /* Шапка страницы (плейлист, трек, артист) */
  .hero { display: flex; align-items: flex-end; gap: 26px; padding: 20px 0 26px; position: relative; flex-wrap: wrap; }
  .hero .art { width: 220px; height: 220px; border-radius: 12px; overflow: hidden; box-shadow: var(--shadow); flex: none; }
  .hero .art img { width: 100%; height: 100%; object-fit: cover; }
  .hero.artist .art { border-radius: 50%; }
  .hero .kind { font-size: 13px; font-weight: 600; }
  .hero h1 { font-size: clamp(32px, 5.5vw, 72px); font-weight: 800; margin: 6px 0 12px; letter-spacing: -.02em; word-break: break-word; }
  .hero .meta { font-size: 14px; color: var(--muted); }
  .hero .meta b { color: var(--text); }
  .actions { display: flex; align-items: center; gap: 18px; padding: 8px 0 22px; flex-wrap: wrap; }
  .big-play { width: 58px; height: 58px; border-radius: 50%; background: var(--accent); color: var(--on-accent); font-size: 22px; display: grid; place-items: center; box-shadow: 0 8px 22px rgba(0,0,0,.35); transition: transform .1s; }
  .big-play:hover { transform: scale(1.06); }
  .icon { font-size: 24px; color: var(--muted); transition: color .15s, transform .1s; }
  .icon:hover { color: var(--text); transform: scale(1.08); }
  .icon.on { color: var(--accent); }

  /* Список треков */
  .tracks { display: grid; }
  .row { display: grid; grid-template-columns: 34px minmax(0, 4fr) minmax(0, 2fr) 60px 70px; gap: 14px; align-items: center; padding: 7px 12px; border-radius: 8px; color: var(--muted); }
  .row:hover { background: var(--hover); }
  .row.head { border-bottom: 1px solid var(--line); border-radius: 0; margin-bottom: 8px; font-size: 12px; text-transform: uppercase; letter-spacing: .08em; }
  .row.head:hover { background: none; }
  .row .num { text-align: center; font-variant-numeric: tabular-nums; }
  .row .num .pb { display: none; font-size: 14px; color: var(--text); }
  .row:hover .num .n { display: none; }
  .row:hover .num .pb { display: inline; }
  .row.cur .num .n, .row.cur .t b { color: var(--accent); }
  .row .t { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .row .t img { width: 42px; height: 42px; border-radius: 6px; object-fit: cover; flex: none; }
  .row .t div { min-width: 0; }
  .row .t b { display: block; color: var(--text); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .t a:hover { text-decoration: underline; color: var(--text); }
  .row .end { display: flex; gap: 10px; justify-content: flex-end; align-items: center; }
  .row .heart { opacity: 0; font-size: 16px; }
  .row:hover .heart, .row .heart.on { opacity: 1; }
  .heart.on { color: var(--accent); }
  .row .more { opacity: 0; font-size: 18px; letter-spacing: 1px; }
  .row:hover .more { opacity: 1; }
  .badge { display: inline-block; font-size: 10px; font-weight: 700; padding: 1px 6px; border-radius: 4px; background: var(--accent-2); color: #fff; margin-left: 6px; vertical-align: middle; }
  .eq { display: inline-flex; gap: 2px; align-items: flex-end; height: 14px; }
  .eq i { width: 3px; background: var(--accent); animation: eq .9s ease-in-out infinite; }
  .eq i:nth-child(2) { animation-delay: -.3s; } .eq i:nth-child(3) { animation-delay: -.6s; }
  @keyframes eq { 0%, 100% { height: 3px; } 50% { height: 14px; } }
  .paused .eq i { animation-play-state: paused; }

  /* Волна трека с комментариями */
  .wave-wrap { position: relative; margin: 10px 0 40px; background: var(--card); border-radius: var(--r); padding: 22px 22px 36px; }
  .wave-wrap canvas { width: 100%; height: 110px; display: block; cursor: pointer; }
  .markers { position: absolute; left: 22px; right: 22px; bottom: 8px; height: 24px; }
  .marker { position: absolute; transform: translateX(-50%); width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--card); font-size: 10px; font-weight: 700; display: grid; place-items: center; color: #1a1a1a; cursor: pointer; }
  .marker:hover::after { content: attr(data-tip); position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 6px 10px; border-radius: 8px; font-size: 12px; font-weight: 500; white-space: nowrap; max-width: 280px; overflow: hidden; text-overflow: ellipsis; z-index: 3; }
  .c-form { display: flex; gap: 10px; margin-bottom: 18px; }
  .c-form .at { flex: none; align-self: center; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .comment { display: flex; gap: 12px; padding: 12px 0; border-top: 1px solid var(--line); }
  .ava { width: 36px; height: 36px; border-radius: 50%; flex: none; display: grid; place-items: center; font-weight: 700; color: #1a1a1a; font-size: 14px; }
  .comment b { font-size: 14px; }
  .comment .ts { color: var(--accent); font-size: 12px; font-weight: 600; margin-left: 6px; cursor: pointer; }
  .comment p { margin-top: 2px; overflow-wrap: anywhere; }

  /* Поиск */
  .search-box { position: relative; max-width: 420px; flex: 1; }
  .search-box input { border-radius: 99px; padding-left: 42px; background: var(--card); }
  .search-box::before { content: "⌕"; position: absolute; left: 16px; top: 50%; transform: translateY(-52%); font-size: 20px; color: var(--muted); }
  .genres { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 16px; }
  .genre { aspect-ratio: 16 / 10; border-radius: 12px; padding: 16px; font-family: "Rubik", sans-serif; font-weight: 800; font-size: 22px; color: #fff; position: relative; overflow: hidden; transition: transform .15s; }
  .genre:hover { transform: scale(1.03); }
  .genre img { position: absolute; width: 90px; height: 90px; right: -12px; bottom: -6px; transform: rotate(22deg); border-radius: 8px; box-shadow: 0 6px 18px rgba(0,0,0,.4); }

  /* Чарт */
  .chart-row .num { font-family: "Rubik", sans-serif; font-weight: 800; font-size: 18px; color: var(--text); }
  .trend { font-size: 11px; font-weight: 700; display: block; }
  .trend.up { color: #3ccf7a; } .trend.down { color: #ef5f6b; } .trend.new { color: var(--accent-2); }

  /* Итоги */
  .stories { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }
  .story { border-radius: 18px; padding: 26px; min-height: 260px; color: #fff; display: flex; flex-direction: column; justify-content: space-between; position: relative; overflow: hidden; }
  .story h3 { font-size: 16px; opacity: .85; font-weight: 700; }
  .story .big { font-family: "Rubik", sans-serif; font-size: 52px; font-weight: 800; line-height: 1; }
  .story img { width: 110px; height: 110px; border-radius: 10px; box-shadow: 0 10px 30px rgba(0,0,0,.4); }
  .story ol { padding-left: 20px; font-weight: 600; }
  .story li { margin: 4px 0; }

  /* Загрузка */
  .drop { border: 2px dashed var(--line); border-radius: 18px; padding: 40px; text-align: center; cursor: pointer; transition: border-color .2s, background .2s; }
  .drop:hover, .drop.over { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 8%, transparent); }
  .drop .big { font-size: 46px; }
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 18px; }
  .form-grid .span2 { grid-column: 1 / -1; }
  label { display: block; font-weight: 600; font-size: 14px; margin: 16px 0 6px; }
  .check { display: flex; gap: 10px; align-items: flex-start; font-weight: 500; font-size: 14px; margin-top: 18px; }
  .check input { width: auto; margin-top: 3px; accent-color: var(--accent); }
  .cover-pick { display: flex; gap: 14px; align-items: center; }
  .cover-pick img { width: 84px; height: 84px; border-radius: 10px; object-fit: cover; background: var(--card); }
  .progress { height: 6px; border-radius: 99px; background: var(--line); overflow: hidden; margin-top: 14px; }
  .progress i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .2s; }

  /* Плеер */
  .player { position: fixed; left: 0; right: 0; bottom: 0; height: 96px; display: grid; grid-template-columns: minmax(200px, 1fr) minmax(320px, 2fr) minmax(200px, 1fr); align-items: center; gap: 20px; padding: 0 18px; background: var(--bg); z-index: 20; }
  .now { display: flex; align-items: center; gap: 14px; min-width: 0; }
  .now .cover { width: 60px; height: 60px; border-radius: 8px; object-fit: cover; flex: none; cursor: pointer; box-shadow: 0 4px 14px rgba(0,0,0,.3); background: var(--card); }
  .now .info { min-width: 0; }
  .now b { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 600; }
  .now a:hover { text-decoration: underline; }
  .now .sub { font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }
  .mini-viz { display: flex; gap: 3px; align-items: flex-end; height: 22px; flex: none; }
  .mini-viz i { width: 3px; height: 3px; border-radius: 2px; background: var(--accent); transition: height .08s; }
  .center { display: grid; gap: 4px; justify-items: center; }
  .ctrl { display: flex; align-items: center; gap: 16px; }
  .ctrl button { font-size: 17px; color: var(--muted); width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; position: relative; }
  .ctrl button:hover { color: var(--text); }
  .ctrl button.on { color: var(--accent); }
  .ctrl button.on::after { content: ""; position: absolute; bottom: 0; width: 4px; height: 4px; border-radius: 50%; background: var(--accent); }
  .ctrl .play { width: 40px; height: 40px; background: var(--text); color: var(--bg); font-size: 15px; }
  .ctrl .play:hover { color: var(--bg); transform: scale(1.06); }
  .seek { display: flex; align-items: center; gap: 10px; width: 100%; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .seek canvas { flex: 1; height: 34px; cursor: pointer; min-width: 0; }
  .right { display: flex; align-items: center; gap: 10px; justify-content: flex-end; }
  .right button { font-size: 16px; color: var(--muted); padding: 6px; border-radius: 8px; position: relative; }
  .right button:hover { color: var(--text); }
  .right button.on { color: var(--accent); }
  .speed { font-size: 12px !important; font-weight: 700; border: 1px solid var(--line) !important; padding: 4px 8px !important; white-space: nowrap; }
  input[type=range] { -webkit-appearance: none; appearance: none; height: 4px; padding: 0; border: 0; border-radius: 99px; background: linear-gradient(to right, var(--text) var(--p, 70%), var(--line) var(--p, 70%)); width: 100px; cursor: pointer; }
  input[type=range]:hover { background: linear-gradient(to right, var(--accent) var(--p, 70%), var(--line) var(--p, 70%)); }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 12px; height: 12px; border-radius: 50%; background: var(--text); }
  input[type=range]::-moz-range-thumb { width: 12px; height: 12px; border: 0; border-radius: 50%; background: var(--text); }
  .timer-left { position: absolute; top: -6px; right: -8px; font-size: 9px; background: var(--accent); color: var(--on-accent); border-radius: 6px; padding: 0 4px; font-weight: 700; }

  /* Всплывающие комментарии во время трека */
  .bubble { position: fixed; left: 50%; bottom: 112px; transform: translateX(-50%) translateY(20px); opacity: 0; z-index: 30; display: flex; align-items: center; gap: 10px; background: var(--card); border: 1px solid var(--line); border-radius: 99px; padding: 6px 16px 6px 6px; box-shadow: var(--shadow); transition: opacity .3s, transform .3s; max-width: calc(100% - 40px); pointer-events: none; }
  .bubble.show { opacity: 1; transform: translateX(-50%); }
  .bubble .ava { width: 30px; height: 30px; font-size: 12px; }
  .bubble span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 14px; }

  /* Полноэкранный режим */
  .full { position: fixed; inset: 0; z-index: 60; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 22px; padding: 30px; color: #fff; overflow: hidden; background: #0b0b10; isolation: isolate; }
  .full.open { display: flex; animation: fadeIn .35s; }
  @keyframes fadeIn { from { opacity: 0; transform: scale(1.03); } }
  .full .bg { position: absolute; inset: -60px; background-size: cover; background-position: center; filter: blur(60px) brightness(.5) saturate(1.4); z-index: -1; transform: scale(1.2); }
  .full .close { position: absolute; top: 20px; right: 24px; font-size: 26px; color: #fff; opacity: .8; }
  .full .big-cover { width: min(42vh, 80vw); height: min(42vh, 80vw); border-radius: 16px; object-fit: cover; box-shadow: 0 30px 80px rgba(0,0,0,.55); transition: transform .08s; }
  .full h2 { font-size: clamp(26px, 4vw, 42px); font-weight: 800; text-align: center; }
  .full .who { opacity: .75; text-align: center; margin-top: -14px; }
  .full .seek { max-width: 640px; color: rgba(255,255,255,.75); }
  .full .ctrl button { color: rgba(255,255,255,.8); font-size: 22px; width: 46px; height: 46px; }

      const db = await this.open();

        const t = db.transaction("uploads", mode);

        t.oncomplete = () => res(out?.result);

  const $ = id => document.getElementById(id);
  const esc = s => String(s ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  const fmt = s => !isFinite(s) ? "0:00" : `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, "0")}`;
  const num = n => n >= 1e6 ? (n / 1e6).toFixed(1).replace(".0", "") + " млн" : n >= 1e3 ? Math.round(n / 1e3) + " тыс." : String(n);
  const uid = () => Math.random().toString(36).slice(2, 10);
  const allTracks = () => [...UPLOADS, ...TRACKS];
  const track = id => allTracks().find(t => t.id === id);
  const artist = id => ARTISTS.find(a => a.id === id);
  const artistName = t => t.mine ? t.artistName : artist(t.artist)?.name || "";
  const artistLink = t => t.mine ? `#/search/${encodeURIComponent(t.artistName)}` : `#/artist/${t.artist}`;
  const plays = t => (t.plays || 0) + (S.plays[t.id] || 0);
  const B36 = "0123456789abcdefghijklmnopqrstuvwxyz";
  const analysisOf = t => t.mine ? t.analysis : window.ANALYSIS?.[t.id];
  const durOf = t => analysisOf(t)?.d || 0;
  const peaksOf = t => [...(analysisOf(t)?.p || "")].map(c => B36.indexOf(c) / 35);
  const avaColor = name => `hsl(${[...name].reduce((h, c) => h + c.charCodeAt(0), 0) % 360} 60% 72%)`;
  const ava = (name, size) => `<span class="ava" style="background:${avaColor(name)}${size ? `;width:${size}px;height:${size}px` : ""}">${esc(name[0] || "?")}</span>`;
  const cssVar = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();

  function toast(msg) {
    const t = $("toast");
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(toast.t);
    toast.t = setTimeout(() => t.classList.remove("show"), 2400);
  }

  // Спектр трека: 16 полос, 12 кадров в секунду
  const frameCache = {};
  function framesOf(t) {
    if (frameCache[t.id]) return frameCache[t.id];
    const f = analysisOf(t)?.f || "";
    const arr = new Float32Array(f.length);
    for (let i = 0; i < f.length; i++) arr[i] = B36.indexOf(f[i]) / 35;
    return frameCache[t.id] = arr;
  }
  function bandsAt(t, time) {
    const fr = framesOf(t), n = fr.length / 16;
    if (!n) return new Array(16).fill(0);
    const x = Math.min(n - 1.001, Math.max(0, time * 12)), i = Math.floor(x), k = x - i;
    return Array.from({ length: 16 }, (_, b) => fr[i * 16 + b] * (1 - k) + (fr[Math.min(n - 1, i + 1) * 16 + b] || 0) * k);
  }

  // =====================================================================
  // ОБЩИЕ БЛОКИ
  // =====================================================================
  function coverOf(item, cls = "") {
    if (item.tracks) {
      const covers = item.tracks.map(id => track(id)?.cover).filter(Boolean);
      if (item.id === "liked") return `<div class="${cls}" style="background:linear-gradient(135deg,var(--accent-2),var(--accent));display:grid;place-items:center;color:#fff;font-size:26px;width:100%;height:100%">♥</div>`;
      if (covers.length >= 4) return `<div class="collage ${cls}">${covers.slice(0, 4).map(c => `<img src="${esc(c)}" alt="">`).join("")}</div>`;
      if (covers.length) return `<img class="${cls}" src="${esc(covers[0])}" alt="">`;
      return `<div class="${cls}" style="background:var(--hover);display:grid;place-items:center;font-size:26px;width:100%;height:100%">♫</div>`;
    }
    return `<img class="${cls}" src="${esc(item.cover)}" alt="" loading="lazy">`;
  }
  const likedPlaylist = () => ({ id: "liked", name: "Любимые треки", desc: "Треки, которые вы отметили ♥", tracks: Object.keys(S.liked).filter(id => S.liked[id] && track(id)).reverse() });
  const playlistOf = id => id === "liked" ? likedPlaylist() : EDITORIAL.find(p => p.id === id) || S.playlists.find(p => p.id === id);

  function trackTile(t) {
    return `<div class="tile" data-open="#/track/${t.id}">
      <div class="art">${coverOf(t)}<button class="fab" data-play="${t.id}" data-ctx="tile" aria-label="Слушать ${esc(t.title)}">▶</button></div>
      <b>${esc(t.title)}</b><span>${esc(artistName(t))}</span></div>`;
  }
  function playlistTile(p) {
    return `<div class="tile" data-open="#/playlist/${p.id}">
      <div class="art">${coverOf(p)}<button class="fab" data-play-list="${p.id}" aria-label="Слушать плейлист">▶</button></div>
      <b>${esc(p.name)}</b><span>${esc(p.desc || `${p.tracks.length} треков`)}</span></div>`;
  }
  function artistTile(a) {
    return `<div class="tile round-art" data-open="#/artist/${a.id}">
      <div class="art"><img src="covers/a-${a.id}.jpg" alt=""></div>
      <b>${esc(a.name)}</b><span>Артист · ${esc(a.genre)}</span></div>`;
  }

  // Строки треков. list — id треков, ctx — откуда играет очередь
  function trackRows(ids, ctx, { chart = false, removable = false } = {}) {
    const cur = currentTrack();
    return `<div class="tracks">
      <div class="row head"><span class="num">#</span><span>Название</span><span class="alb">${chart ? "Прослушивания" : "Жанр"}</span><span class="dur">⏱</span><span></span></div>
      ${ids.map((id, i) => {
        const t = track(id);
        if (!t) return "";
        const isCur = cur && cur.id === id;
        const trend = chart ? (t.trend === "new" ? `<span class="trend new">NEW</span>` : t.trend > 0 ? `<span class="trend up">▲${t.trend}</span>` : t.trend < 0 ? `<span class="trend down">▼${-t.trend}</span>` : `<span class="trend">—</span>`) : "";
        return `<div class="row${chart ? " chart-row" : ""}${isCur ? " cur" : ""}" data-row="${id}" data-ctx="${ctx}">
          <span class="num">${isCur && !audio.paused ? `<span class="n"><span class="eq"><i></i><i></i><i></i></span></span>` : `<span class="n">${i + 1}</span>`}<button class="pb" data-play="${id}" data-ctx="${ctx}" aria-label="Играть">${isCur && !audio.paused ? "⏸" : "▶"}</button>${trend}</span>
          <span class="t"><img src="${esc(t.cover)}" alt=""><div><a href="#/track/${t.id}"><b>${esc(t.title)}${t.mine ? `<span class="badge">ВАШ</span>` : ""}</b></a><a class="small" href="${artistLink(t)}">${esc(artistName(t))}</a></div></span>
          <span class="alb small">${chart ? num(plays(t)) : esc(t.genre)}</span>
          <span class="dur small">${fmt(durOf(t))}</span>
          <span class="end"><button class="heart${S.liked[id] ? " on" : ""}" data-like="${id}" aria-label="В любимое">${S.liked[id] ? "♥" : "♡"}</button><button class="more" data-more="${id}" ${removable ? `data-from="${ctx}"` : ""} aria-label="Ещё">⋯</button></span>
        </div>`;
      }).join("")}</div>`;
  }

  function setGlow(color) {
    $("glow").style.background = `linear-gradient(180deg, ${color || "var(--accent-2)"} 0%, transparent 100%)`;
  }

  // =====================================================================
  // СТРАНИЦЫ
  // =====================================================================
  function pageHome() {
    setGlow("var(--accent-2)");
    const h = new Date().getHours();
    const greet = h < 5 ? "Доброй ночи" : h < 12 ? "Доброе утро" : h < 18 ? "Добрый день" : "Добрый вечер";
    const recent = [...new Set(S.history)].slice(0, 6).map(track).filter(Boolean);
    const chart = [...allTracks()].sort((a, b) => plays(b) - plays(a)).slice(0, 5).map(t => t.id);
    const quick = [likedPlaylist(), ...S.playlists.slice(0, 2), ...EDITORIAL].slice(0, 6);
    return `<h1 class="greet">${greet}${S.name ? `, ${esc(S.name)}` : ""}</h1>
      <div class="quick">${quick.map(p => `<a href="#/playlist/${p.id}"><div class="mini">${coverOf(p)}</div>${esc(p.name)}</a>`).join("")}</div>

      <div class="wave-card">
        <svg class="waves" viewBox="0 0 460 200" aria-hidden="true"><path d="M0 120 Q60 70 120 120 T240 120 T360 120 T480 120" stroke="#fff" stroke-width="3" fill="none"/><path d="M0 140 Q60 100 120 140 T240 140 T360 140 T480 140" stroke="#fff" stroke-width="2" fill="none" opacity=".6"/><path d="M0 160 Q60 130 120 160 T240 160 T360 160 T480 160" stroke="#fff" stroke-width="2" fill="none" opacity=".35"/></svg>
        <h2>🌊 Моя волна</h2>
        <p>Бесконечный поток музыки под ваше настроение. Чем больше лайков — тем точнее подбор.</p>
        <div class="moods">${Object.entries(MOODS).map(([k, [ic, n]]) => `<button class="mood${player.wave === k ? " on" : ""}" data-wave="${k}">${ic} ${n}</button>`).join("")}
          <button class="mood${player.wave === "all" ? " on" : ""}" data-wave="all">🎲 Любое</button></div>
      </div>

      ${CC_TRACKS.length ? `<div class="section"><div class="section-head"><h2>Настоящая музыка</h2><a href="#/playlist/free">Все ${CC_TRACKS.length} треков</a></div>
        <p class="small muted" style="margin:-8px 0 14px">Реальные треки музыкантов, которые разрешили свободно делиться своей музыкой. <a href="#/licenses" style="text-decoration:underline">Авторы и лицензии</a></p>
        <div class="shelf">${CC_TRACKS.slice(0, 6).map(trackTile).join("")}</div></div>` : ""}

      ${recent.length ? `<div class="section"><div class="section-head"><h2>Недавно слушали</h2><a href="#/library/history">Вся история</a></div><div class="shelf">${recent.map(trackTile).join("")}</div></div>` : ""}

      <div class="section"><div class="section-head"><h2>Чарт недели</h2><a href="#/charts">Весь чарт</a></div>${trackRows(chart, "chart", { chart: true })}</div>

      <div class="section"><div class="section-head"><h2>Подборки Толқын</h2></div><div class="shelf">${EDITORIAL.map(playlistTile).join("")}</div></div>

      <div class="section"><div class="section-head"><h2>Новые релизы</h2></div><div class="shelf">${TRACKS.slice(0, 6).map(trackTile).join("")}</div></div>

      <div class="section"><div class="section-head"><h2>От слушателей</h2><a href="#/upload">Загрузить свой трек</a></div>
        ${UPLOADS.length ? `<div class="shelf">${UPLOADS.slice(0, 6).map(trackTile).join("")}</div>`
          : `<div class="note" style="display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap"><span>Здесь появятся треки, которые загрузите вы. Каждый может выложить свою музыку.</span><a class="pill accent" href="#/upload">⤒ Загрузить трек</a></div>`}</div>

      <div class="section"><div class="section-head"><h2>Популярные артисты</h2></div><div class="shelf">${[...ARTISTS].sort((a, b) => b.listeners - a.listeners).slice(0, 6).map(artistTile).join("")}</div></div>`;
  }

  let searchQuery = "";
  function pageSearch(q) {
    setGlow("var(--accent)");
    if (q !== undefined) searchQuery = decodeURIComponent(q);
    return `<div style="display:flex;gap:12px;margin:4px 0 26px"><div class="search-box"><input id="search" placeholder="Что хотите послушать?" value="${esc(searchQuery)}" autocomplete="off"></div></div>
      <div id="search-results">${searchResults()}</div>`;
  }
  function searchResults() {
    const q = searchQuery.trim().toLowerCase();
    if (!q) {
      const genres = [...new Set(allTracks().map(t => t.genre))];
      return `<h2 style="font-size:22px;margin-bottom:14px">Жанры и настроения</h2>
        <div class="genres">${Object.entries(MOODS).map(([k, [ic, n]]) => `<button class="genre" style="background:linear-gradient(135deg,var(--accent-2),var(--accent))" data-wave="${k}">${ic} ${n}</button>`).join("")}
        ${genres.map(g => { const t = allTracks().find(t => t.genre === g); return `<a class="genre" href="#/search/${encodeURIComponent(g)}" style="background:${GENRE_COLORS[g] || "#666"}">${esc(g)}${t ? `<img src="${esc(t.cover)}" alt="">` : ""}</a>`; }).join("")}</div>`;
    }
    const tr = allTracks().filter(t => [t.title, artistName(t), t.genre, MOODS[t.mood]?.[1]].join(" ").toLowerCase().includes(q));
    const ar = ARTISTS.filter(a => (a.name + " " + a.genre).toLowerCase().includes(q));
    const pl = [...EDITORIAL, ...S.playlists].filter(p => p.name.toLowerCase().includes(q));
    if (!tr.length && !ar.length && !pl.length) return `<div class="empty"><div class="big">🔍</div>Ничего не нашлось по запросу «${esc(searchQuery)}»</div>`;
    return `${tr.length ? `<div class="section"><div class="section-head"><h2>Треки</h2></div>${trackRows(tr.map(t => t.id), "search")}</div>` : ""}
      ${ar.length ? `<div class="section"><div class="section-head"><h2>Артисты</h2></div><div class="shelf">${ar.map(artistTile).join("")}</div></div>` : ""}
      ${pl.length ? `<div class="section"><div class="section-head"><h2>Плейлисты</h2></div><div class="shelf">${pl.map(playlistTile).join("")}</div></div>` : ""}`;
  }

  function pagePlaylist(id) {
    const p = playlistOf(id);
    if (!p) return `<div class="empty"><div class="big">♫</div>Плейлист не найден</div>`;
    const first = track(p.tracks[0]);
    setGlow(id === "liked" ? "var(--accent-2)" : first?.color);
    const mine = S.playlists.includes(p);
    const total = p.tracks.reduce((s, tid) => s + durOf(track(tid) || {}), 0);
    return `<div class="hero"><div class="art">${coverOf(p)}</div>
        <div><div class="kind">${mine ? "Ваш плейлист" : id === "liked" ? "Плейлист" : "Подборка Толқын"}</div><h1>${esc(p.name)}</h1>
        <div class="meta">${p.desc ? esc(p.desc) + " · " : ""}<b>${p.tracks.length} треков</b>, ${Math.round(total / 60)} мин</div></div></div>
      <div class="actions">
        <button class="big-play" data-play-list="${p.id}" aria-label="Слушать">▶</button>
        <button class="icon" data-play-list="${p.id}" data-shuffle title="Перемешать" aria-label="Перемешать">⤮</button>
        ${mine ? `<button class="icon" data-rename="${p.id}" title="Переименовать" aria-label="Переименовать">✎</button><button class="icon" data-del-playlist="${p.id}" title="Удалить" aria-label="Удалить">🗑</button>` : ""}
        <button class="icon" data-share title="Поделиться" aria-label="Поделиться">↗</button>
      </div>
      ${p.tracks.length ? trackRows(p.tracks, "pl:" + p.id, { removable: mine })
        : `<div class="empty"><div class="big">${id === "liked" ? "♥" : "♫"}</div>${id === "liked" ? "Нажимайте ♡ рядом с треками — они появятся здесь" : "Добавляйте треки через ⋯ → «Добавить в плейлист»"}</div>`}`;
  }

  function pageTrack(id) {
    const t = track(id);
    if (!t) return `<div class="empty"><div class="big">♫</div>Трек не найден</div>`;
    setGlow(t.color);
    const comments = [...(BASE_COMMENTS[id] || []).map(([at, name, text]) => ({ at, name, text })), ...(S.comments[id] || [])].sort((a, b) => a.at - b.at);
    const similar = allTracks().filter(x => x.id !== id && (x.mood === t.mood || x.genre === t.genre)).slice(0, 6);
    const isCur = currentTrack()?.id === id;
    return `<div class="hero"><div class="art">${coverOf(t)}</div>
        <div><div class="kind">Трек${t.mine ? " · загружен слушателем" : ""}</div><h1>${esc(t.title)}</h1>
        <div class="meta"><a href="${artistLink(t)}"><b>${esc(artistName(t))}</b></a> · ${esc(t.genre)} · ${MOODS[t.mood]?.join(" ") || ""} · ${fmt(durOf(t))} · ${num(plays(t))} прослушиваний</div></div></div>
      <div class="actions">
        <button class="big-play" data-play="${t.id}" data-ctx="track" aria-label="Слушать">${isCur && !audio.paused ? "⏸" : "▶"}</button>
        <button class="icon${S.liked[id] ? " on" : ""}" data-like="${id}" aria-label="В любимое">${S.liked[id] ? "♥" : "♡"}</button>
        <button class="icon" data-more="${id}" aria-label="Ещё">⋯</button>
        <button class="icon" data-share title="Поделиться" aria-label="Поделиться">↗</button>
        ${t.mine ? `<button class="icon" data-del-upload="${id}" title="Удалить трек" aria-label="Удалить трек">🗑</button>` : ""}
      </div>
      ${t.desc ? `<p class="muted" style="max-width:700px;margin-bottom:10px">${esc(t.desc)}</p>` : ""}
      ${t.real ? `<p class="small muted" style="margin-bottom:10px">Лицензия: <b>${esc(t.license)}</b> · Автор записи: ${esc(t.author || artistName(t))} · <a href="${esc(t.source)}" target="_blank" rel="noopener" style="text-decoration:underline">источник</a></p>` : ""}
      <div class="wave-wrap"><canvas id="track-wave" data-track="${id}" aria-label="Волна трека, нажмите для перемотки"></canvas>
        <div class="markers">${comments.map(c => `<span class="marker" style="left:${Math.min(100, c.at / (durOf(t) || 1) * 100)}%;background:${avaColor(c.name)}" data-seek-to="${c.at}" data-track-id="${id}" data-tip="${esc(c.name)}: ${esc(c.text)}">${esc(c.name[0])}</span>`).join("")}</div></div>
      <div class="section"><div class="section-head"><h2>Комментарии к моментам трека (${comments.length})</h2></div>
        <form class="c-form" id="c-form" data-track="${id}"><span class="at" id="c-at">на ${fmt(isCur ? audio.currentTime : 0)}</span>
          <input id="c-text" maxlength="200" placeholder="Что вы чувствуете в этот момент трека?" required><button class="pill accent">Отправить</button></form>
        <p class="small muted" style="margin:-8px 0 12px">Комментарий привяжется к текущей секунде трека и всплывёт у других слушателей в этот момент.</p>
        ${comments.map(c => `<div class="comment">${ava(c.name)}<div><b>${esc(c.name)}</b><span class="ts" data-seek-to="${c.at}" data-track-id="${id}">${fmt(c.at)}</span><p>${esc(c.text)}</p></div></div>`).join("") || `<p class="muted">Будьте первым!</p>`}</div>
      ${similar.length ? `<div class="section"><div class="section-head"><h2>Похожие треки</h2></div><div class="shelf">${similar.map(trackTile).join("")}</div></div>` : ""}`;
  }

  function pageArtist(id) {
    const a = artist(id);
    if (!a) return `<div class="empty">Артист не найден</div>`;
    const tracks = TRACKS.filter(t => t.artist === id).sort((x, y) => plays(y) - plays(x));
    setGlow(tracks[0]?.color);
    const followed = S.follows[id];
    return `<div class="hero artist"><div class="art"><img src="covers/a-${id}.jpg" alt=""></div>
        <div><div class="kind">✓ Артист</div><h1>${esc(a.name)}</h1><div class="meta">${a.real ? "Музыка под свободной лицензией" : `<b>${(a.listeners + (followed ? 1 : 0)).toLocaleString("ru-RU")}</b> слушателей в месяц`} · ${esc(a.genre)}</div></div></div>
      <div class="actions">
        <button class="big-play" data-play-artist="${id}" aria-label="Слушать">▶</button>
        <button class="pill ${followed ? "" : "ghost"}" data-follow="${id}">${followed ? "Вы подписаны" : "Подписаться"}</button>
      </div>
      <div class="section"><div class="section-head"><h2>Популярное</h2></div>${trackRows(tracks.map(t => t.id), "artist:" + id)}</div>
      <div class="section"><div class="section-head"><h2>Об артисте</h2></div><p class="muted" style="max-width:640px">${esc(a.bio)}</p></div>
      <div class="section"><div class="section-head"><h2>Похожие артисты</h2></div><div class="shelf">${ARTISTS.filter(x => x.id !== id && x.genre === a.genre).concat(ARTISTS.filter(x => x.id !== id && x.genre !== a.genre)).slice(0, 5).map(artistTile).join("")}</div></div>`;
  }

  function pageCharts() {
    setGlow("#e0542e");
    const top = [...allTracks()].sort((a, b) => plays(b) - plays(a)).map(t => t.id);
    return `<div class="hero"><div class="art" style="background:linear-gradient(135deg,#e0542e,#6a1b9a);display:grid;place-items:center;font-size:80px">📈</div>
      <div><div class="kind">Чарт</div><h1>Топ Толқын</h1><div class="meta">Самые прослушиваемые треки недели. Ваши прослушивания тоже считаются!</div></div></div>
      <div class="actions"><button class="big-play" data-play-chart aria-label="Слушать чарт">▶</button></div>
      ${trackRows(top, "chart", { chart: true })}`;
  }

  let libTab = "playlists";
  function pageLibrary(tab) {
    setGlow("var(--accent-2)");
    if (tab) libTab = tab;
    const tabs = [["playlists", "Плейлисты"], ["liked", "Любимые"], ["uploads", "Мои загрузки"], ["history", "История"], ["artists", "Артисты"]];
    let body;
    if (libTab === "playlists") body = `<div class="shelf"><div class="tile" data-new-playlist><div class="art" style="background:var(--hover);display:grid;place-items:center;font-size:44px">＋</div><b>Новый плейлист</b><span>Соберите свою подборку</span></div>${[likedPlaylist(), ...S.playlists].map(playlistTile).join("")}</div>`;
    if (libTab === "liked") body = likedPlaylist().tracks.length ? trackRows(likedPlaylist().tracks, "pl:liked") : `<div class="empty"><div class="big">♥</div>Пока нет любимых треков</div>`;

  // =====================================================================
  // РОУТИНГ
  // =====================================================================
  function renderSide() {
    const cur = location.hash;
    $("side-lib").innerHTML = [likedPlaylist(), ...S.playlists].map(p => `<a class="lib-item${cur === "#/playlist/" + p.id ? " on" : ""}" href="#/playlist/${p.id}"><div class="mini">${coverOf(p)}</div><div style="min-width:0"><b>${esc(p.name)}</b><span>Плейлист · ${p.tracks.length} треков</span></div></a>`).join("")
      + (UPLOADS.length ? `<a class="lib-item${cur === "#/library/uploads" ? " on" : ""}" href="#/library/uploads"><div class="mini" style="background:var(--hover);display:grid;place-items:center;font-size:18px">⤒</div><div><b>Мои загрузки</b><span>${UPLOADS.length} треков</span></div></a>` : "");
    $("theme-btn").textContent = document.documentElement.dataset.theme === "dark" ? "☀️" : "🌙";
  }

  function render() {
    const [page, arg] = location.hash.replace(/^#\/?/, "").split("/");
    const views = { "": pageHome, search: () => pageSearch(arg), playlist: () => pagePlaylist(arg), track: () => pageTrack(arg), artist: () => pageArtist(arg),
      charts: pageCharts, library: () => pageLibrary(arg), wrapped: pageWrapped, upload: pageUpload, licenses: pageLicenses };
    $("page").innerHTML = (views[page] || pageHome)();
    document.querySelectorAll("[data-nav]").forEach(l => l.classList.toggle("on", l.dataset.nav === (page || "")));
    renderSide();
    drawTrackWave();
    if (page === "search") { const s = $("search"); s.focus(); s.setSelectionRange(s.value.length, s.value.length); }
  }
  window.addEventListener("hashchange", () => { render(); $("main").scrollTop = 0; scrollTo(0, 0); closeMenu(); });
  $("main").addEventListener("scroll", () => $("topbar").classList.toggle("scrolled", $("main").scrollTop > 20));

  // =====================================================================
  // ПЛЕЕР
  // =====================================================================
  const audio = $("audio");
  const player = { queue: [], idx: -1, shuffle: false, repeat: false, wave: null, speed: 0, sleepAt: null, sleepEnd: false, shown: new Set() };
  const SPEEDS = [[1, "1×", true], [0.82, "Slowed", false], [1.22, "Speed up", false]];
  audio.volume = S.volume / 100;

  const currentTrack = () => track(player.queue[player.idx]);

  function playQueue(ids, startId, ctx) {
    if (!ids.length) return;
    player.wave = ctx === "wave" ? player.wave : null;
    if (player.shuffle && !startId) startId = ids[Math.floor(Math.random() * ids.length)];
    player.queue = [...ids];
    loadTrack(Math.max(0, player.queue.indexOf(startId ?? ids[0])));
  }
  function loadTrack(i) {
    player.idx = i;
    const t = currentTrack();
    if (!t) return;
    audio.src = t.src;
    applySpeed();
    audio.play().catch(() => {});
    player.shown = new Set();
    S.history = [t.id, ...S.history.filter(x => x !== t.id)].slice(0, 50);
    S.plays[t.id] = (S.plays[t.id] || 0) + 1;
    save();
    updatePlayer();
    updateMediaSession(t);
  }
  function step(dir) {
    if (!player.queue.length) return;
    if (player.wave && dir > 0 && player.idx >= player.queue.length - 2) extendWave();
    let i = player.shuffle && dir > 0 ? Math.floor(Math.random() * player.queue.length) : player.idx + dir;
    if (i >= player.queue.length) i = 0;
    if (i < 0) i = player.queue.length - 1;
    loadTrack(i);
  }

  // «Моя волна»: подбираем треки под настроение, любимые — чаще
  function waveBatch(mood, n = 6) {
    const pool = allTracks().filter(t => mood === "all" || t.mood === mood);
    const recent = player.queue.slice(-3);
    const weighted = pool.flatMap(t => Array(S.liked[t.id] ? 3 : 1).fill(t.id)).filter(id => !recent.includes(id));
    const out = [];
    while (out.length < n && weighted.length) {
      const id = weighted[Math.floor(Math.random() * weighted.length)];
      if (out[out.length - 1] !== id) out.push(id);
      if (new Set(out).size >= pool.length && out.length >= pool.length) break;
    }
    return out.length ? out : pool.map(t => t.id);
  }
  function startWave(mood) {
    player.wave = mood;
    player.shuffle = false;
    player.queue = waveBatch(mood, 8);
    loadTrack(0);
    toast(`🌊 Моя волна · ${mood === "all" ? "Любое настроение" : MOODS[mood][1]}`);
    if (location.hash === "" || location.hash === "#/") render();
  }
  function extendWave() { player.queue.push(...waveBatch(player.wave, 6)); }

  function updatePlayer() {
    const t = currentTrack();
    const playing = t && !audio.paused;
    $("p-play").textContent = $("f-play").textContent = playing ? "⏸" : "▶";
    document.body.classList.toggle("paused", !playing);
    if (t) {
      $("p-cover").src = $("f-cover").src = t.cover;
      $("f-bg").style.backgroundImage = `url("${t.cover}")`;
      $("p-title").textContent = $("f-title").textContent = t.title;
      $("p-title-link").href = `#/track/${t.id}`;
      $("p-artist").textContent = player.wave ? `🌊 Моя волна · ${artistName(t)}` : artistName(t);
      $("p-artist").href = artistLink(t);
      $("f-artist").textContent = artistName(t);
      $("p-like").textContent = S.liked[t.id] ? "♥" : "♡";
      $("p-like").classList.toggle("on", !!S.liked[t.id]);
      $("p-dur").textContent = $("f-dur").textContent = fmt(durOf(t) || audio.duration);
    }
    document.querySelectorAll('[data-pl="shuffle"]').forEach(b => b.classList.toggle("on", player.shuffle));
    document.querySelectorAll('[data-pl="repeat"]').forEach(b => b.classList.toggle("on", player.repeat));
    $("p-speed").textContent = SPEEDS[player.speed][1];
    $("p-speed").classList.toggle("on", player.speed !== 0);
    $("p-vol").value = Math.round(audio.volume * 100);
    $("p-vol").style.setProperty("--p", audio.volume * 100 + "%");
    // Обновляем отметки «играет сейчас» в списках без полной перерисовки
    document.querySelectorAll("[data-row]").forEach(row => {
      const on = t && row.dataset.row === t.id;
      row.classList.toggle("cur", !!on);
      const n = row.querySelector(".n"), pb = row.querySelector(".pb");
      if (on && playing) n.innerHTML = `<span class="eq"><i></i><i></i><i></i></span>`;
      else if (n.querySelector(".eq")) n.textContent = [...row.parentNode.querySelectorAll("[data-row]")].indexOf(row) + 1;
      if (pb) pb.textContent = on && playing ? "⏸" : "▶";
    });
    document.querySelectorAll(".big-play[data-play]").forEach(b => b.textContent = t && b.dataset.play === t.id && playing ? "⏸" : "▶");
    drawWaves();
  }

  function applySpeed() {
    const [rate, , keepPitch] = SPEEDS[player.speed];
    audio.playbackRate = rate;
    // Slowed и Speed up меняют и тон — тот самый эффект из TikTok
    audio.preservesPitch = audio.mozPreservesPitch = audio.webkitPreservesPitch = keepPitch;
  }

  // Волна-прогресс: в плеере, полноэкранном режиме и на странице трека
  function drawWave(canvas, t, progress, colors) {
    if (!canvas || !t) return;
    const dpr = devicePixelRatio || 1, w = canvas.clientWidth, h = canvas.clientHeight;
    if (!w || !h) return;
    if (canvas.width !== w * dpr || canvas.height !== h * dpr) { canvas.width = w * dpr; canvas.height = h * dpr; }
    const ctx = canvas.getContext("2d");
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, w, h);
    const peaks = peaksOf(t);
    if (!peaks.length) return;
    const bars = Math.max(30, Math.floor(w / 4)), bw = w / bars;
    for (let i = 0; i < bars; i++) {
      const p = peaks[Math.floor(i / bars * peaks.length)] || 0;
      const bh = Math.max(2, p * h * .95);
      ctx.fillStyle = i / bars <= progress ? colors[0] : colors[1];
      ctx.fillRect(i * bw + .5, (h - bh) / 2, Math.max(1, bw - 1.5), bh);
    }
  }
  function progressOf(t) {
    const d = durOf(t) || audio.duration;
    return d ? Math.min(1, audio.currentTime / d) : 0;
  }
  function drawWaves() {
    const t = currentTrack();
    if (!t) return;
    const p = progressOf(t);
    drawWave($("p-wave"), t, p, [cssVar("--accent"), cssVar("--line")]);
    if ($("full").classList.contains("open")) drawWave($("f-wave"), t, p, ["#ffffff", "rgba(255,255,255,.25)"]);
    drawTrackWave();
  }
  function drawTrackWave() {
    const c = $("track-wave");
    if (!c) return;
    const t = track(c.dataset.track), cur = currentTrack();
    drawWave(c, t, cur && cur.id === t.id ? progressOf(t) : 0, [cssVar("--accent"), cssVar("--line")]);
  }
  function seekFromEvent(e, canvas, t) {
    const r = canvas.getBoundingClientRect();
    const x = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width));
    const d = durOf(t) || audio.duration;
    if (d) audio.currentTime = x * d;
  }
  [["p-wave"], ["f-wave"]].forEach(([id]) => {
    const c = $(id);
    let drag = false;
    c.addEventListener("pointerdown", e => { const t = currentTrack(); if (!t) return; drag = true; c.setPointerCapture(e.pointerId); seekFromEvent(e, c, t); });
    c.addEventListener("pointermove", e => { if (drag) seekFromEvent(e, c, currentTrack()); });
    c.addEventListener("pointerup", () => drag = false);
  });
  $("p-wave").addEventListener("keydown", e => {
    if (e.key === "ArrowRight") { audio.currentTime += 5; e.preventDefault(); }
    if (e.key === "ArrowLeft") { audio.currentTime -= 5; e.preventDefault(); }
  });

  audio.addEventListener("timeupdate", () => {
    const t = currentTrack();
    if (!t) return;
    $("p-cur").textContent = $("f-cur").textContent = fmt(audio.currentTime);
    const ca = $("c-at");
    if (ca && $("c-form")?.dataset.track === t.id) ca.textContent = "на " + fmt(audio.currentTime);
    drawWaves();
    // Учёт прослушанного времени для «Итогов»
    const now = audio.currentTime;
    if (player.lastTime !== undefined && now > player.lastTime && now - player.lastTime < 2) {
      S.listened[t.id] = (S.listened[t.id] || 0) + (now - player.lastTime);
      save();
    }
    player.lastTime = now;
    // Всплывающие комментарии на своей секунде
    if (S.settings.bubbles) {
      const all = [...(BASE_COMMENTS[t.id] || []).map(([at, name, text]) => ({ at, name, text })), ...(S.comments[t.id] || [])];
      const c = all.find(c => !player.shown.has(c.at + c.name) && now >= c.at && now - c.at < 1.2);
      if (c) { player.shown.add(c.at + c.name); showBubble(c); }
    }
    if (player.sleepAt && Date.now() >= player.sleepAt) { audio.pause(); player.sleepAt = null; updateSleep(); toast("😴 Таймер сна: спокойной ночи"); }
  });
  audio.addEventListener("seeking", () => { player.lastTime = undefined; });
  audio.addEventListener("play", () => { updatePlayer(); startViz(); });
  audio.addEventListener("pause", updatePlayer);
  audio.addEventListener("loadedmetadata", updatePlayer);
  audio.addEventListener("ended", () => {
    player.lastTime = undefined;
    if (player.sleepEnd) { player.sleepEnd = false; updateSleep(); toast("😴 Трек закончился — спокойной ночи"); return; }
    if (player.repeat) { audio.currentTime = 0; audio.play(); }
    else step(1);
  });
  audio.addEventListener("error", () => { if (currentTrack()) toast("Не удалось открыть аудиофайл"); });
  $("p-vol").addEventListener("input", e => {
    audio.volume = e.target.value / 100;
    S.volume = +e.target.value;
    e.target.style.setProperty("--p", e.target.value + "%");
    save();
  });

  function showBubble(c) {
    const b = $("bubble");
    b.innerHTML = `${ava(c.name)}<span><b>${esc(c.name)}</b> · ${esc(c.text)}</span>`;
    b.classList.add("show");
    clearTimeout(showBubble.t);
    showBubble.t = setTimeout(() => b.classList.remove("show"), 3500);
  }

  // Визуализатор: спектр, посчитанный заранее, синхронно с текущей секундой
  let vizRunning = false;
  function startViz() {
    if (vizRunning) return;
    vizRunning = true;
    const mini = [...$("mini-viz").children];
    let smooth = new Array(16).fill(0);
    const loop = () => {
      const t = currentTrack();
      if (!t || audio.paused) { vizRunning = false; mini.forEach(i => i.style.height = "3px"); return; }
      const b = bandsAt(t, audio.currentTime);
      smooth = smooth.map((v, i) => v + (b[i] - v) * .35);
      [1, 3, 6, 9, 12].forEach((band, i) => mini[i].style.height = 3 + smooth[band] * 19 + "px");
      if ($("full").classList.contains("open")) drawFullViz(smooth);
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  }
  function drawFullViz(bands) {
    const c = $("f-viz"), dpr = devicePixelRatio || 1, w = c.clientWidth, h = c.clientHeight;
    if (c.width !== w * dpr) { c.width = w * dpr; c.height = h * dpr; }
    const ctx = c.getContext("2d");
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, w, h);
    const n = 64, bw = w / n;
    for (let i = 0; i < n; i++) {
      const x = Math.abs(i - n / 2) / (n / 2);
      const v = bands[Math.min(15, Math.floor(x * 16))] * (1 - x * .3);
      const bh = Math.max(3, v * h);
      const g = ctx.createLinearGradient(0, h - bh, 0, h);
      g.addColorStop(0, "rgba(255,255,255,.9)");
      g.addColorStop(1, "rgba(255,255,255,.05)");
      ctx.fillStyle = g;
      ctx.fillRect(i * bw + 1, h - bh, bw - 2, bh);
    }

  // =====================================================================
  // ЗАГРУЗКА ТРЕКОВ: анализ звука прямо в браузере
  // =====================================================================
  function fft(re, im) {
    const n = re.length;
    for (let i = 1, j = 0; i < n; i++) {
      let bit = n >> 1;
      for (; j & bit; bit >>= 1) j ^= bit;
      j ^= bit;
      if (i < j) { [re[i], re[j]] = [re[j], re[i]]; [im[i], im[j]] = [im[j], im[i]]; }
    }
    for (let len = 2; len <= n; len <<= 1) {
      const ang = -2 * Math.PI / len, wr = Math.cos(ang), wi = Math.sin(ang);
      for (let i = 0; i < n; i += len) {
        let cr = 1, ci = 0;
        for (let k = 0; k < len / 2; k++) {
          const a = i + k, b = a + len / 2;
          const xr = re[b] * cr - im[b] * ci, xi = re[b] * ci + im[b] * cr;
          re[b] = re[a] - xr; im[b] = im[a] - xi; re[a] += xr; im[a] += xi;
          [cr, ci] = [cr * wr - ci * wi, cr * wi + ci * wr];
        }
      }
    }
  }
  async function analyseAudio(blob, onProgress) {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const buf = await ctx.decodeAudioData(await blob.arrayBuffer());
    ctx.close();
    const sr = buf.sampleRate, ch = buf.getChannelData(0);
    const enc = v => B36[Math.round(Math.max(0, Math.min(1, v)) * 35)];
    // Волна: 160 пиков
    const step = Math.floor(ch.length / 160);
    const peaks = Array.from({ length: 160 }, (_, i) => { let m = 0; for (let j = i * step; j < (i + 1) * step; j += 8) m = Math.max(m, Math.abs(ch[j])); return m; });
    const pm = Math.max(...peaks) || 1;
    // Спектр: 16 полос, 12 кадров в секунду
    const win = 1024, hop = Math.floor(sr / 12), edges = Array.from({ length: 17 }, (_, i) => 40 * Math.pow(12000 / 40, i / 16));
    const hann = Float32Array.from({ length: win }, (_, i) => .5 - .5 * Math.cos(2 * Math.PI * i / win));
    const frames = [];
    const total = Math.floor((ch.length - win) / hop);
    for (let f = 0; f < total; f++) {
      const re = new Float32Array(win), im = new Float32Array(win);
      for (let i = 0; i < win; i++) re[i] = ch[f * hop + i] * hann[i];
      fft(re, im);
      const bands = new Array(16).fill(0), counts = new Array(16).fill(0);
      for (let k = 1; k < win / 2; k++) {
        const fr = k * sr / win;
        const b = edges.findIndex((e, i) => i < 16 && fr >= e && fr < edges[i + 1]);
        if (b >= 0) { bands[b] += Math.hypot(re[k], im[k]); counts[b]++; }
      }
      frames.push(bands.map((v, i) => 20 * Math.log10(v / (counts[i] || 1) + 1e-6)));
      if (f % 200 === 0) { onProgress(f / total); await new Promise(r => setTimeout(r)); }
    }
    const flat = frames.flat().filter(isFinite).sort((a, b) => a - b);
    const lo = flat[Math.floor(flat.length * .05)] || 0, hi = flat[flat.length - 1] || 1;
    return { d: Math.round(buf.duration * 100) / 100, p: peaks.map(p => enc(p / pm)).join(""), f: frames.flat().map(v => enc((v - lo) / (hi - lo || 1))).join("") };
  }
  // Обложка: своя картинка или сгенерированный градиент
  function makeCover(file) {
    return new Promise(res => {
      const c = document.createElement("canvas");
      c.width = c.height = 500;
      const ctx = c.getContext("2d");
      const done = () => c.toBlob(b => res(b), "image/jpeg", .88);
      if (file) {
        const img = new Image();
        img.onload = () => { const s = Math.min(img.width, img.height); ctx.drawImage(img, (img.width - s) / 2, (img.height - s) / 2, s, s, 0, 0, 500, 500); URL.revokeObjectURL(img.src); done(); };
        img.onerror = () => { file = null; gen(); done(); };
        img.src = URL.createObjectURL(file);
      } else { gen(); done(); }
      function gen() {
        const h = Math.random() * 360;
        const g = ctx.createLinearGradient(0, 0, 500, 500);
        g.addColorStop(0, `hsl(${h} 70% 55%)`); g.addColorStop(1, `hsl(${(h + 70) % 360} 65% 25%)`);
        ctx.fillStyle = g; ctx.fillRect(0, 0, 500, 500);
        for (let i = 0; i < 4; i++) {
          const x = Math.random() * 500, y = Math.random() * 500, r = 120 + Math.random() * 160;
          const rg = ctx.createRadialGradient(x, y, 0, x, y, r);
          rg.addColorStop(0, `hsla(${(h + i * 50) % 360} 90% 75% / .7)`); rg.addColorStop(1, "transparent");
          ctx.fillStyle = rg; ctx.fillRect(0, 0, 500, 500);
        }
      }
    });
  }

  function idsForCtx(ctx) {
    if (!ctx || ctx === "track" || ctx === "tile") return allTracks().map(t => t.id);
    if (ctx === "chart") return [...allTracks()].sort((a, b) => plays(b) - plays(a)).map(t => t.id);
    if (ctx === "search") return [...document.querySelectorAll('#search-results [data-row]')].map(r => r.dataset.row);
    if (ctx === "history") return [...new Set(S.history)].filter(track);
    if (ctx === "uploads") return UPLOADS.map(t => t.id);
    if (ctx.startsWith("pl:")) return playlistOf(ctx.slice(3))?.tracks || [];
    if (ctx.startsWith("artist:")) return TRACKS.filter(t => t.artist === ctx.slice(7)).sort((x, y) => plays(y) - plays(x)).map(t => t.id);
    return allTracks().map(t => t.id);
  }

    if (f.id === "pl-form") {
      const p = { id: "p" + uid(), name: $("pl-name").value.trim(), desc: "", tracks: f.dataset.add ? [f.dataset.add] : [] };
      S.playlists.push(p); save(); closeModal();
      toast(`Плейлист «${p.name}» создан`);
      location.hash = "#/playlist/" + p.id;
    }
    if (f.id === "rename-form") { S.playlists.find(p => p.id === f.dataset.id).name = $("rename-input").value.trim(); save(); closeModal(); render(); }
    if (f.id === "c-form") {
      if (!S.name) return askName(() => f.requestSubmit());
      const id = f.dataset.track, cur = currentTrack();
      const at = cur && cur.id === id ? Math.floor(audio.currentTime) : 0;
      (S.comments[id] ||= []).push({ at, name: S.name, text: $("c-text").value.trim() });
      save(); render(); toast(`Комментарий оставлен на ${fmt(at)}`);
    }
    if (f.id === "u-form") publishUpload();
  });

  document.addEventListener("keydown", e => {
    if (e.key === "Escape") { closeModal(); closeMenu(); closeFull(); }
    if (e.target.closest("input, textarea, select")) return;
    if (e.code === "Space") { e.preventDefault(); if (!currentTrack()) startWave("all"); else audio.paused ? audio.play() : audio.pause(); }
    if (!currentTrack()) return;
    if (e.key === "ArrowRight" && e.shiftKey) step(1);
    else if (e.key === "ArrowLeft" && e.shiftKey) step(-1);
    else if (e.key === "ArrowRight" && e.target.id !== "p-wave") audio.currentTime += 5;
    else if (e.key === "ArrowLeft" && e.target.id !== "p-wave") audio.currentTime -= 5;
    if (e.key.toLowerCase() === "l" || e.key.toLowerCase() === "д") toggleLike(currentTrack().id);
    if (e.key.toLowerCase() === "f" || e.key.toLowerCase() === "а") $("full").classList.contains("open") ? closeFull() : openFull();
  });
  addEventListener("resize", drawWaves);

  // =====================================================================
  // ЗАПУСК
  // =====================================================================
  (async () => {
    await loadUploads();
    render();
    updatePlayer();
    updateSleep();
    // Последний трек ждёт в плеере, как в настоящих приложениях
    const last = S.history.find(track);
    if (last) { player.queue = allTracks().map(t => t.id); player.idx = player.queue.indexOf(last); audio.src = track(last).src; updatePlayer(); }
  })();
</script>
</body>
</html>
